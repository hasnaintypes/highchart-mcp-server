[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "highchart-mcp-sdk"
version = "0.1.0"
description = "Python client SDK for the Highcharts MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "ISC" }
authors = [{ name = "Hasnain" }]
dependencies = ["mcp>=1.0.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/highchart_mcp_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
