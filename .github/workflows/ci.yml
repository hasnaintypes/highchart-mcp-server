name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      # Tests mock the export server, so Chromium isn't needed — skip the download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build (server + CLI)
        run: npm run build

      - name: Test (server + CLI)
        run: npm test

      - name: Build & test JS/TS SDK
        run: |
          npm run build --workspace @highchart-mcp/sdk
          npm test --workspace @highchart-mcp/sdk

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + unit test
        working-directory: packages/sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t highchart-mcp-server:ci .

      - name: Smoke test (run the image, hit /health, render an SVG)
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e TRANSPORT=http -e PORT=3000 \
            --shm-size=512m highchart-mcp-server:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then break; fi
            echo "waiting for health ($i/30)..."; sleep 2
          done
          curl -fsS http://localhost:3000/health

          # End-to-end: initialize an MCP session and render a real chart,
          # exercising the offline Highcharts cache + headless Chromium.
          # Catches regressions like an incomplete cache manifest or a
          # browser that fails to launch in the container (both shipped
          # silently before this smoke test existed, since a plain
          # `docker build` never runs the image).
          session=$(curl -fsS -D - -o /tmp/init.json http://localhost:3000/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0.0"}}}' \
            | grep -i '^mcp-session-id:' | tr -d '\r' | cut -d' ' -f2)
          echo "session=$session"
          test -n "$session"

          curl -fsS http://localhost:3000/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -H "mcp-session-id: $session" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' -o /dev/null

          curl -fsS http://localhost:3000/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -H "mcp-session-id: $session" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"create_chart","arguments":{"type":"line","series":[{"data":[1,2,3]}],"format":"svg"}}}' \
            -o /tmp/chart.json
          grep -q '<svg' /tmp/chart.json

      - name: Container logs
        if: always()
        run: docker logs smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true
