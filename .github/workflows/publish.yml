name: Publish

# Publishes each package only when its version (package.json / pyproject.toml)
# is ahead of what's currently on the registry. Bump the version as part of
# your change; merging to master does the rest. Uses npm/PyPI trusted
# publishing (OIDC) — no long-lived registry tokens are stored as secrets.
#
# One-time setup required before this workflow can publish anything:
#   - npmjs.com: on each package's Settings page, add this repo + this workflow
#     file (.github/workflows/publish.yml) as a "Trusted Publisher" — for both
#     `@highchart-mcp/server` and `@highchart-mcp/sdk`.
#   - pypi.org: on the `highchart-mcp-sdk` project's Settings > Publishing page,
#     add this repo + this workflow file as a "Trusted Publisher".

on:
  push:
    branches: [master]
    paths:
      - "package.json"
      - "src/**"
      - "packages/sdk-js/**"
      - "packages/sdk-python/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish-server:
    name: Publish @highchart-mcp/server (npm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check for version bump
        id: check
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @highchart-mcp/server version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL published=$PUBLISHED"
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: npm ci

      - name: Build & test
        if: steps.check.outputs.publish == 'true'
        run: |
          npm run build
          npm test

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public

  publish-sdk-js:
    name: Publish @highchart-mcp/sdk (npm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check for version bump
        id: check
        working-directory: packages/sdk-js
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @highchart-mcp/sdk version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL published=$PUBLISHED"
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: npm ci

      - name: Build & test
        if: steps.check.outputs.publish == 'true'
        run: |
          npm run build -w @highchart-mcp/sdk
          npm test -w @highchart-mcp/sdk

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        working-directory: packages/sdk-js
        run: npm publish --provenance --access public

  publish-sdk-python:
    name: Publish highchart-mcp-sdk (PyPI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for version bump
        id: check
        working-directory: packages/sdk-python
        run: |
          LOCAL=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PUBLISHED=$(curl -fsS https://pypi.org/pypi/highchart-mcp-sdk/json 2>/dev/null | python -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" || echo "0.0.0")
          echo "local=$LOCAL published=$PUBLISHED"
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install + test
        if: steps.check.outputs.publish == 'true'
        working-directory: packages/sdk-python
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[test]"
          pytest

      - name: Build sdist/wheel
        if: steps.check.outputs.publish == 'true'
        working-directory: packages/sdk-python
        run: python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-python/dist
